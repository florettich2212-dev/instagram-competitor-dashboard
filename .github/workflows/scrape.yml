name: Scrape Instagram Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental = only new posts (cheapest) · refresh-all = recent window for every account, no skipping (upgrades images) · backfill = full history (most expensive)'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - refresh-all
          - backfill
      deepen:
        description: 'Comma-separated accounts to deep-pull (extends truncated history). Overrides mode. Leave blank for normal incremental refreshes.'
        required: false
        default: ''
        type: string
      deepen_limit:
        description: 'Posts per deepened account'
        required: false
        default: '120'
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      # Pre-load existing images so the scraper skips re-downloading them,
      # and so images for untouched history survive the force-push.
      - name: Restore existing images from data branch
        run: |
          git fetch origin data 2>/dev/null || true
          git checkout origin/data -- images/ 2>/dev/null || true
          mkdir -p output/images
          cp -rn images/. output/images/ 2>/dev/null || true
          echo "images present before scrape: $(ls output/images 2>/dev/null | wc -l)"

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODE: ${{ inputs.mode || 'incremental' }}
          DEEPEN: ${{ inputs.deepen }}
          DEEPEN_LIMIT: ${{ inputs.deepen_limit || '120' }}
        run: python scrape.py

      - name: Push data to data branch
        run: |
          cd output
          git init
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b data
          git add -A
          git commit -m "Data update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git data
